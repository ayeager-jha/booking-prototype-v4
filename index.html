/*
 * Figma (North Star / Horizon) token alignment for this prototype.
 *
 * digital-ux's theming plugin layers jh-platform-design-system-variable-overrides.css on top of the
 * official jh-tokens for every platform app (swapped container primary/secondary, #707070
 * divider-secondary, platform input styling). The North Star Figma uses the official values, so this
 * file restores them. Only --jh-color-container-page keeps the platform value (white), which is also
 * what Figma uses. Inputs fall back to their official styling (divider-primary border).
 *
 * Loaded after the theme by vite.config.ts. Delete this file to return to the platform look.
 */
:root {
  --jh-color-overlay: var(--jh-color-black-alpha-50);
  --jh-color-container-primary-enabled: var(--jh-color-white-alpha-100);
  --jh-color-container-primary-hover: var(--jh-color-gray-50);
  --jh-color-container-primary-active: var(--jh-color-gray-100);
  --jh-color-container-secondary-enabled: var(--jh-color-gray-50);
  --jh-color-container-secondary-hover: var(--jh-color-white-alpha-100);
  --jh-color-container-secondary-selected: var(--jh-color-blue-100);
  --jh-color-container-neutral-enabled: var(--jh-color-gray-100);
  --jh-color-container-neutral-hover: var(--jh-color-gray-150);
  --jh-color-container-neutral-active: var(--jh-color-gray-200);
  /* divider-primary keeps the platform's light value: legacy jha-wc tables/filters read it directly
     for hairlines. Strong control borders (inputs) come from the official control token instead. */
  --jh-border-control-color: var(--jh-color-gray-500);
  --jh-color-divider-secondary: var(--jh-color-gray-100);
  --jh-input-color-background: initial; /* drop platform override */
  --jh-input-field-color-background: initial; /* drop platform override */
  --jh-input-color-border-enabled: initial; /* drop platform override */
  --jh-select-input-field-color-background: initial; /* drop platform override */
}

@media (prefers-color-scheme: dark) {
  :root {
    --jh-color-container-primary-enabled: var(--jh-color-gray-900);
    --jh-color-container-primary-hover: var(--jh-color-gray-850);
    --jh-color-container-primary-active: var(--jh-color-gray-800);
    --jh-color-container-secondary-enabled: var(--jh-color-gray-850);
    --jh-color-container-secondary-hover: var(--jh-color-gray-900);
    --jh-color-container-secondary-active: var(--jh-color-gray-800);
    --jh-color-container-secondary-selected: var(--jh-color-blue-800);
    --jh-color-container-neutral-enabled: var(--jh-color-gray-800);
    --jh-color-container-neutral-hover: var(--jh-color-gray-750);
    --jh-color-container-neutral-active: var(--jh-color-gray-700);
    --jh-color-container-brand-enabled: var(--jh-color-blue-800);
    --jh-color-container-brand-hover: var(--jh-color-blue-750);
    --jh-color-container-brand-active: var(--jh-color-blue-700);
    --jh-color-container-positive-enabled: var(--jh-color-green-800);
    --jh-color-container-positive-hover: var(--jh-color-green-750);
    --jh-color-container-positive-active: var(--jh-color-green-700);
    --jh-color-container-negative-enabled: var(--jh-color-red-800);
    --jh-color-container-negative-hover: var(--jh-color-red-750);
    --jh-color-container-negative-active: var(--jh-color-red-700);
    --jh-color-content-secondary-enabled: var(--jh-color-gray-300);
    --jh-color-content-secondary-hover: var(--jh-color-gray-250);
    --jh-color-content-secondary-active: var(--jh-color-gray-200);
    --jh-color-content-inverse-hover: var(--jh-color-gray-850);
    --jh-color-content-inverse-active: var(--jh-color-gray-800);
    --jh-border-control-color: var(--jh-color-gray-400);
    --jh-color-divider-secondary: var(--jh-color-gray-800);
    --jh-color-control-enabled: var(--jh-color-gray-750);
    --jh-color-control-hover: var(--jh-color-gray-700);
    --jh-color-control-active: var(--jh-color-gray-650);
  }
}

        min-width: 0;
        border: none;
        background: transparent;
        outline: none;
        padding: 0;

        font-family: var(--jh-font-body-regular-1-font-family);
        font-weight: var(--jh-font-body-regular-1-font-weight);

        text-align: left;

        display: none;
        align-items: center;
        flex-shrink: 0;
      }

        font-weight: var(--jh-font-code-regular-1-font-weight);

        color: var(--jh-input-suffix-color-text, var(--jh-color-content-secondary-enabled));
      }
      slot[name="jh-input-left"] {
        display: none;
        align-items: center;
        flex-shrink: 0;
        padding-right: var(--jh-dimension-200);
      }
      slot[name="jh-input-right"] {
        display: none;
        align-items: center;
        flex-shrink: 0;
        padding-left: var(--jh-dimension-200);
      }
      slot[name="jh-input-left"].display-slot,
      slot[name="jh-input-right"].display-slot {

        display: flex;
        align-items: center;
      }

      }

          var(--jh-border-control-color)

      }

      .input-wrapper:has(input:focus-visible) {
        border-color: var(
          --jh-input-field-color-border-focus,
          var(--jh-color-content-brand-hover)
        );
        outline-color: var(
          --jh-input-color-focus,
          var(--jh-border-focus-color)
        );
        outline-style: var(--jh-border-focus-style);
        outline-width: var(--jh-border-focus-width);
        outline-offset: 1px;
      }
      input:focus-visible {
        outline: none;
      }
      .input-wrapper:hover {
        border-color: var(
          --jh-input-field-color-border-hover,
          var(--jh-color-content-brand-hover)
        );
      }
      :host([invalid]) .input-wrapper {

        border-style: var(--jh-border-error-style);
        border-color: var(

          var(--jh-border-error-color)

        --jh-button-color-border-tertiary-enabled: var(--jh-input-clear-color-border-enabled);

        background-color: transparent;
        border: none;
        padding-left: 0;
